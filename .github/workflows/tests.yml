name: tests

on:
  pull_request:

jobs:
  test:
    # Owner PRs and main use the equivalent credential-free Railway build gate.
    # Outside contributors retain this executor until Railway admits their PRs.
    if: github.event.pull_request.user.login != 'beepboop2025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build production app
        run: npm run build

      - name: Coverage summary
        if: always()
        run: echo "See the 'Run tests with coverage' step above for the v8 coverage table."
