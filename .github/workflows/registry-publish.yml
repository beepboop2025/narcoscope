name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character origin/main commit deployed to NarcoScope
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: narcoscope-mcp-registry-publish
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "1.8.0"
  MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
  MCP_SERVER_NAME: "io.github.beepboop2025/narcoscope"
  RELEASE_VERSION: "1.4.0"
  LIVE_ORIGIN: "https://narcoscope.com"

jobs:
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - name: Require the exact origin/main release commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$HEAD_SHA" = "$MAIN_SHA"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$HEAD_SHA" = "$REQUESTED_COMMIT"

      - name: Install checksum-verified MCP publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate the exact Registry server card
        run: |
          set -euo pipefail
          cmp server.json public/server.json
          ./mcp-publisher validate server.json
          jq -e \
            --arg name "$MCP_SERVER_NAME" \
            --arg version "$RELEASE_VERSION" \
            --arg remote "$LIVE_ORIGIN/mcp" \
            '.name == $name
             and .version == $version
             and .websiteUrl == $ENV.LIVE_ORIGIN
             and .remotes == [{"type":"streamable-http","url":$remote}]' \
            server.json >/dev/null

      - name: Prove version 1.4.0 is live before publication
        run: |
          set -euo pipefail
          LIVE_CARD="$(mktemp)"
          DISCOVER_HEADERS="$(mktemp)"
          DISCOVER_BODY="$(mktemp)"
          trap 'rm -f "$LIVE_CARD" "$DISCOVER_HEADERS" "$DISCOVER_BODY"' EXIT

          curl --fail --location --retry 6 --retry-all-errors --silent --show-error \
            "$LIVE_ORIGIN/server.json" --output "$LIVE_CARD"
          cmp server.json "$LIVE_CARD"

          curl --fail --location --retry 6 --retry-all-errors --silent --show-error \
            --dump-header "$DISCOVER_HEADERS" \
            --output "$DISCOVER_BODY" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2026-07-28' \
            --header 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":"registry-release-gate","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"narcoscope-registry-release-gate","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
            "$LIVE_ORIGIN/mcp"

          if grep -qi '^Mcp-Session-Id:' "$DISCOVER_HEADERS"; then
            echo "MCP 2026 response unexpectedly created a protocol session" >&2
            exit 1
          fi
          jq -e \
            --arg version "$RELEASE_VERSION" \
            '.jsonrpc == "2.0"
             and .id == "registry-release-gate"
             and .result.resultType == "complete"
             and .result.supportedVersions == ["2026-07-28"]
             and .result.capabilities.tools.listChanged == false
             and .result.ttlMs > 0
             and .result.cacheScope == "public"
             and .result._meta["io.modelcontextprotocol/serverInfo"].version == $version' \
            "$DISCOVER_BODY" >/dev/null

      - name: Authenticate with GitHub OIDC and publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

      - name: Verify Registry active and latest state
        run: |
          set -euo pipefail
          ENCODED_NAME="io.github.beepboop2025%2Fnarcoscope"
          EXACT_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/${RELEASE_VERSION}"
          LATEST_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_NAME}/versions/latest"
          EXACT_RECEIPT="$(mktemp)"
          LATEST_RECEIPT="$(mktemp)"
          trap 'rm -f "$EXACT_RECEIPT" "$LATEST_RECEIPT"' EXIT

          verified=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$EXACT_URL" --output "$EXACT_RECEIPT" \
              && curl --fail --silent --show-error "$LATEST_URL" --output "$LATEST_RECEIPT" \
              && jq -e \
                --arg name "$MCP_SERVER_NAME" \
                --arg version "$RELEASE_VERSION" \
                --arg remote "$LIVE_ORIGIN/mcp" \
                '.server.name == $name
                 and .server.version == $version
                 and .server.remotes == [{"type":"streamable-http","url":$remote}]
                 and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
                "$EXACT_RECEIPT" >/dev/null \
              && jq -e \
                --arg name "$MCP_SERVER_NAME" \
                --arg version "$RELEASE_VERSION" \
                '.server.name == $name
                 and .server.version == $version
                 and ._meta["io.modelcontextprotocol.registry/official"].status == "active"
                 and ._meta["io.modelcontextprotocol.registry/official"].isLatest == true' \
                "$LATEST_RECEIPT" >/dev/null; then
              verified=true
              break
            fi
            echo "Registry receipt not ready (attempt ${attempt}/18)" >&2
            sleep 10
          done
          test "$verified" = true
          jq '{server: {name: .server.name, version: .server.version, remotes: .server.remotes}, official: ._meta["io.modelcontextprotocol.registry/official"]}' "$LATEST_RECEIPT"
